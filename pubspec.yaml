name: novaplay
description: A modern offline video player for Android.
publish_to: "none"
version: 1.0.4+5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#05060D'
  adaptive_icon_foreground: assets/icons/play_foreground.png

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  permission_handler: ^13.0.1
  file_picker: ^12.0.0
  video_thumbnail: ^0.5.6
  screen_brightness: ^2.1.11
  volume_controller: ^3.6.1
  wakelock_plus: ^1.4.0
  sensors_plus: ^6.1.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: ^0.20.2
  collection: ^1.19.1
  http: ^1.4.0
  path: ^1.9.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  ffmpeg_kit_audio_flutter: ^1.1.0
  saver_gallery: ^5.1.0
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  on_audio_query: ^2.9.0
  dart_cast: ^0.7.4
  google_mobile_ads: ^9.1.0
  ringtone_set_plus: ^0.0.2+2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
