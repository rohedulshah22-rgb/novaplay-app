name: NovaPlay Optimized Fast Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Clear stale pub credentials
        run: dart pub token remove https://pub.dev || true

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Patch legacy on_audio_query Android namespace
        shell: bash
        run: |
          python3 - << 'EOF'
          import glob, os

          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          target_files = glob.glob(os.path.join(cache_dir, 'on_audio_query_android*', 'android', 'build.gradle'))

          for file_path in target_files:
              with open(file_path, 'r') as f:
                  content = f.read()

              if 'namespace' not in content:
                  content = content.replace('android {', "android {\n    namespace 'com.lucasjosino.on_audio_query'")

              if 'sourceCompatibility JavaVersion.VERSION_17' not in content:
                  compile_opts = "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }"
                  content = content.replace('android {', compile_opts, 1)

              if 'tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile)' not in content:
                  content += "\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '17' } }\n"

              with open(file_path, 'w') as f:
                  f.write(content)
              print(f"Successfully patched: {file_path}")
          EOF

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-optimized-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Build Optimized App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-optimized-aab
          path: build/app/outputs/bundle/release/app-release.aab
          
