name: NovaPlay Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Analyze, test, and build production release App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build production App Bundle
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: flutter build appbundle --release

      - name: Verify production App Bundle
        run: test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload production App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-production-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build production APK for device testing
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: flutter build apk --release
      - name: Verify production APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-production-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
