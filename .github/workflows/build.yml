name: NovaPlay Optimized Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Clear stale pub credentials
        run: dart pub token remove https://pub.dev || true

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Patch legacy on_audio_query Android namespace
        shell: bash
        run: |
          query_gradle=$(find "$PUB_CACHE/hosted/pub.dev" -path "*/on_audio_query_android*/android/build.gradle" 2>/dev/null | head -n 1)
          if [ -z "$query_gradle" ]; then
            echo 'on_audio_query_android build.gradle was not found'
            exit 1
          fi
          if ! grep -q 'namespace' "$query_gradle"; then
            sed -i '/android {/a\\    namespace '\''com.lucasjosino.on_audio_query'\''' "$query_gradle"
          fi
          if ! grep -q 'sourceCompatibility JavaVersion.VERSION_17' "$query_gradle"; then
            sed -i '/android {/a\\    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17\\n    }' "$query_gradle"
          fi
          if ! grep -q 'KotlinCompile' "$query_gradle"; then
            printf '\n%s\n' 'tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = "17" } }' >> "$query_gradle"
          fi

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-optimized-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Build Optimized App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: novaplay-optimized-aab
          path: build/app/outputs/bundle/release/app-release.aab
          
